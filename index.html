<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Valency Match 3</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: #0a0e1a;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(20, 60, 120, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(60, 20, 100, 0.2) 0%, transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(40, 60, 100, 0.08) 39px, rgba(40, 60, 100, 0.08) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(40, 60, 100, 0.08) 39px, rgba(40, 60, 100, 0.08) 40px);
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 10px;
  overflow: hidden;
}

#game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 360px;
  padding: 8px 4px;
}

#game-title {
  color: #00e5ff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
}

#score-display {
  color: #76ff03;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(118, 255, 3, 0.5);
}

#canvas-container {
  position: relative;
  border: 2px solid #1a3a5c;
  border-radius: 4px;
  box-shadow:
    0 0 20px rgba(0, 100, 200, 0.3),
    inset 0 0 30px rgba(0, 0, 0, 0.5);
  background: #060a14;
}

#gameCanvas {
  display: block;
}

#info-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  max-width: 360px;
  margin-top: 8px;
}

#next-block {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: rgba(10, 20, 40, 0.8);
  border: 1px solid #1a3a5c;
  border-radius: 4px;
}

#history-panel {
  flex: 1;
  background: rgba(10, 20, 40, 0.8);
  border: 1px solid #1a3a5c;
  border-radius: 4px;
  padding: 4px 8px;
  overflow: hidden;
}

#history-panel .history-title {
  color: #8892a4;
  font-size: 10px;
  margin-bottom: 2px;
}

#history-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

#history-list li {
  font-size: 11px;
  color: #c0d0e0;
  padding: 1px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#history-list li .hist-formula {
  color: #ffeb3b;
  font-weight: bold;
}

#history-list li .hist-name {
  color: #80cbc4;
  margin-left: 4px;
}

#next-block span {
  color: #8892a4;
  font-size: 12px;
}

#next-block-preview {
  width: 40px;
  height: 40px;
}

#controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 360px;
  margin-top: 12px;
}

.ctrl-btn {
  background: linear-gradient(180deg, #1a2a4a 0%, #0d1a30 100%);
  border: 1px solid #2a4a7a;
  border-radius: 8px;
  color: #a0c4ff;
  font-size: 22px;
  font-weight: bold;
  padding: 14px 0;
  cursor: pointer;
  transition: all 0.1s;
  touch-action: manipulation;
}

.ctrl-btn:active {
  background: linear-gradient(180deg, #2a4a7a 0%, #1a2a4a 100%);
  border-color: #4a8aff;
  color: #ffffff;
  box-shadow: 0 0 12px rgba(74, 138, 255, 0.4);
  transform: scale(0.95);
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5, 10, 20, 0.92);
  border-radius: 4px;
  z-index: 10;
}

#overlay.hidden {
  display: none;
}

#overlay h2 {
  color: #ff1744;
  font-size: 28px;
  margin-bottom: 10px;
  text-shadow: 0 0 15px rgba(255, 23, 68, 0.6);
}

#overlay p {
  color: #b0bec5;
  font-size: 14px;
  margin-bottom: 6px;
}

#overlay .final-score {
  color: #76ff03;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

#restart-btn {
  background: linear-gradient(180deg, #00c853 0%, #009624 100%);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  padding: 12px 32px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  touch-action: manipulation;
}

#restart-btn:active {
  transform: scale(0.95);
}

#formula-popup {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}

.formula-text {
  position: absolute;
  color: #ffeb3b;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255, 235, 59, 0.8), 0 0 20px rgba(255, 235, 59, 0.4);
  animation: popUp 1.5s ease-out forwards;
  white-space: nowrap;
}

@keyframes popUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
}
</style>
</head>
<body>

<div id="game-header">
  <span id="game-title">VALENCY MATCH 3</span>
  <span id="score-display">SCORE: 0</span>
</div>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay" class="hidden">
    <h2>GAME OVER</h2>
    <p>Final Score</p>
    <div class="final-score" id="final-score">0</div>
    <button id="restart-btn">PLAY AGAIN</button>
  </div>
  <div id="formula-popup"></div>
</div>

<div id="info-row">
  <div id="next-block">
    <span>NEXT:</span>
    <canvas id="next-block-preview"></canvas>
  </div>
  <div id="history-panel">
    <div class="history-title">RECENT COMPOUNDS</div>
    <ul id="history-list"></ul>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-left">&larr;</button>
  <button class="ctrl-btn" id="btn-right">&rarr;</button>
  <button class="ctrl-btn" id="btn-cycle">&#x21BB;</button>
  <button class="ctrl-btn" id="btn-drop">&darr;</button>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const COLS = 6;
const ROWS = 10;
const BLOCK_SIZE = 56;
const FALL_INTERVAL_INITIAL = 800;
const FALL_INTERVAL_MIN = 200;
const SPEED_INCREASE_PER_SCORE = 0.5;

const IONS = [
  { symbol: 'Na',  charge: +1, display: 'Na⁺',     color: '#2979ff', colorDark: '#1565c0' },
  { symbol: 'Mg',  charge: +2, display: 'Mg²⁺', color: '#448aff', colorDark: '#1a52c9' },
  { symbol: 'Al',  charge: +3, display: 'Al³⁺', color: '#6a9fff', colorDark: '#2a62d0' },
  { symbol: 'Cl',  charge: -1, display: 'Cl⁻',     color: '#ff6d00', colorDark: '#c43e00' },
  { symbol: 'O',   charge: -2, display: 'O²⁻',  color: '#ff3d00', colorDark: '#b71c1c' },
];

// ============================================================
// GAME STATE
// ============================================================
const state = {
  grid: [],
  currentBlock: null,
  nextIonIndex: 0,
  score: 0,
  gameOver: false,
  lastFallTime: 0,
  fallInterval: FALL_INTERVAL_INITIAL,
  flashingCells: [],
  flashStartTime: 0,
  isFlashing: false,
  formulaPopups: [],
  inputQueue: [],
  compoundHistory: [],
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const previewCanvas = document.getElementById('next-block-preview');
const previewCtx = previewCanvas.getContext('2d');

canvas.width = COLS * BLOCK_SIZE;
canvas.height = ROWS * BLOCK_SIZE;
previewCanvas.width = 40;
previewCanvas.height = 40;

// ============================================================
// INITIALIZATION
// ============================================================
function initGrid() {
  state.grid = [];
  for (let r = 0; r < ROWS; r++) {
    state.grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      state.grid[r][c] = null;
    }
  }
}

function resetGame() {
  initGrid();
  state.score = 0;
  state.gameOver = false;
  state.lastFallTime = performance.now();
  state.fallInterval = FALL_INTERVAL_INITIAL;
  state.flashingCells = [];
  state.isFlashing = false;
  state.formulaPopups = [];
  state.inputQueue = [];
  state.compoundHistory = [];
  state.nextIonIndex = randomIonIndex();
  spawnBlock();
  document.getElementById('overlay').classList.add('hidden');
  updateScoreDisplay();
  renderHistory();
}

function randomIonIndex() {
  return Math.floor(Math.random() * IONS.length);
}

// ============================================================
// BLOCK SPAWNING
// ============================================================
function spawnBlock() {
  const ionIndex = state.nextIonIndex;
  state.nextIonIndex = randomIonIndex();
  const col = Math.floor(COLS / 2);

  if (state.grid[0][col] !== null) {
    triggerGameOver();
    return;
  }

  state.currentBlock = {
    row: 0,
    col: col,
    ionIndex: ionIndex,
  };

  renderNextPreview();
}

function triggerGameOver() {
  state.gameOver = true;
  state.currentBlock = null;
  document.getElementById('final-score').textContent = state.score;
  document.getElementById('overlay').classList.remove('hidden');
}

// ============================================================
// INPUT HANDLING
// ============================================================
function handleInput(action) {
  if (state.gameOver || state.isFlashing || !state.currentBlock) return;

  switch (action) {
    case 'left':
      moveBlock(0, -1);
      break;
    case 'right':
      moveBlock(0, 1);
      break;
    case 'cycle':
      cycleIon();
      break;
    case 'drop':
      dropBlock();
      break;
  }
}

function moveBlock(dRow, dCol) {
  const block = state.currentBlock;
  const newCol = block.col + dCol;
  const newRow = block.row + dRow;

  if (newCol < 0 || newCol >= COLS) return false;
  if (newRow < 0 || newRow >= ROWS) return false;
  if (state.grid[newRow][newCol] !== null) return false;

  block.col = newCol;
  block.row = newRow;
  return true;
}

function cycleIon() {
  const block = state.currentBlock;
  block.ionIndex = (block.ionIndex + 1) % IONS.length;
}

function dropBlock() {
  const block = state.currentBlock;
  while (canFall(block)) {
    block.row++;
  }
  landBlock();
}

function canFall(block) {
  const nextRow = block.row + 1;
  if (nextRow >= ROWS) return false;
  if (state.grid[nextRow][block.col] !== null) return false;
  return true;
}

// ============================================================
// BLOCK LANDING & MATCH DETECTION
// ============================================================
function landBlock() {
  const block = state.currentBlock;
  state.grid[block.row][block.col] = block.ionIndex;
  state.currentBlock = null;
  checkMatches(block.row, block.col);
}

function checkMatches(row, col) {
  const component = getConnectedComponent(row, col);
  if (component.length < 2) {
    spawnBlock();
    return;
  }

  const match = findZeroSumSubset(component);
  if (match) {
    startFlashAnimation(match);
  } else {
    spawnBlock();
  }
}

function getConnectedComponent(startRow, startCol) {
  const visited = new Set();
  const queue = [{ row: startRow, col: startCol }];
  const component = [];
  const key = (r, c) => r * COLS + c;

  visited.add(key(startRow, startCol));

  while (queue.length > 0) {
    const { row, col } = queue.shift();
    component.push({ row, col, ionIndex: state.grid[row][col] });

    const neighbors = [
      { row: row - 1, col },
      { row: row + 1, col },
      { row, col: col - 1 },
      { row, col: col + 1 },
    ];

    for (const n of neighbors) {
      if (n.row < 0 || n.row >= ROWS || n.col < 0 || n.col >= COLS) continue;
      if (visited.has(key(n.row, n.col))) continue;
      if (state.grid[n.row][n.col] === null) continue;

      visited.add(key(n.row, n.col));
      queue.push(n);
    }
  }

  return component;
}

function findZeroSumSubset(component) {
  let bestMatch = null;

  for (let size = 2; size <= Math.min(component.length, 5); size++) {
    const results = findAllConnectedSubsetsWithSum(component, size, 0);
    for (const result of results) {
      const formula = generateFormula(result);
      if (COMPOUND_NAMES[formula]) {
        if (!bestMatch || result.length > bestMatch.length) {
          bestMatch = result;
        }
      }
    }
  }

  return bestMatch;
}

function findAllConnectedSubsetsWithSum(component, targetSize, targetSum) {
  const key = (r, c) => r * COLS + c;
  const componentSet = new Set(component.map(cell => key(cell.row, cell.col)));
  const componentMap = new Map(component.map(cell => [key(cell.row, cell.col), cell]));
  const results = [];
  const seen = new Set();

  for (let i = 0; i < component.length; i++) {
    dfsSearchAll(
      [component[i]],
      IONS[component[i].ionIndex].charge,
      new Set([key(component[i].row, component[i].col)]),
      targetSize,
      targetSum,
      componentSet,
      componentMap,
      results,
      seen
    );
  }

  return results;
}

function dfsSearchAll(current, currentSum, visited, targetSize, targetSum, componentSet, componentMap, results, seen) {
  if (current.length === targetSize) {
    if (currentSum === targetSum) {
      const signature = [...visited].sort().join(',');
      if (!seen.has(signature)) {
        seen.add(signature);
        results.push([...current]);
      }
    }
    return;
  }

  const candidates = new Set();
  const key = (r, c) => r * COLS + c;

  for (const cell of current) {
    const neighbors = [
      { row: cell.row - 1, col: cell.col },
      { row: cell.row + 1, col: cell.col },
      { row: cell.row, col: cell.col - 1 },
      { row: cell.row, col: cell.col + 1 },
    ];

    for (const n of neighbors) {
      const nKey = key(n.row, n.col);
      if (!visited.has(nKey) && componentSet.has(nKey)) {
        candidates.add(nKey);
      }
    }
  }

  for (const candKey of candidates) {
    const cell = componentMap.get(candKey);
    const charge = IONS[cell.ionIndex].charge;

    visited.add(candKey);
    current.push(cell);

    dfsSearchAll(current, currentSum + charge, visited, targetSize, targetSum, componentSet, componentMap, results, seen);

    current.pop();
    visited.delete(candKey);
  }
}

// ============================================================
// COMPOUND NAMES
// ============================================================
const COMPOUND_NAMES = {
  'NaCl': 'Sodium Chloride',
  'MgCl₂': 'Magnesium Chloride',
  'AlCl₃': 'Aluminium Chloride',
  'Na₂O': 'Sodium Oxide',
  'MgO': 'Magnesium Oxide',
  'Al₂O₃': 'Aluminium Oxide',
};

// ============================================================
// CHEMICAL FORMULA GENERATION
// ============================================================
function generateFormula(cells) {
  const counts = {};
  for (const cell of cells) {
    const ion = IONS[cell.ionIndex];
    if (!counts[ion.symbol]) {
      counts[ion.symbol] = { count: 0, charge: ion.charge };
    }
    counts[ion.symbol].count++;
  }

  const cations = [];
  const anions = [];

  for (const [symbol, data] of Object.entries(counts)) {
    if (data.charge > 0) {
      cations.push({ symbol, count: data.count });
    } else {
      anions.push({ symbol, count: data.count });
    }
  }

  let formula = '';
  for (const cat of cations) {
    formula += cat.symbol;
    if (cat.count > 1) formula += subscript(cat.count);
  }
  for (const an of anions) {
    formula += an.symbol;
    if (an.count > 1) formula += subscript(an.count);
  }

  return formula;
}

function subscript(n) {
  const subs = ['₀', '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];
  return String(n).split('').map(d => subs[parseInt(d)]).join('');
}

// ============================================================
// FLASH ANIMATION & CLEARING
// ============================================================
function startFlashAnimation(cells) {
  state.isFlashing = true;
  state.flashingCells = cells;
  state.flashStartTime = performance.now();

  const formula = generateFormula(cells);
  const name = COMPOUND_NAMES[formula] || 'Ionic Compound';
  const avgCol = cells.reduce((s, c) => s + c.col, 0) / cells.length;
  const avgRow = cells.reduce((s, c) => s + c.row, 0) / cells.length;

  showFormulaPopup(formula, name, avgCol * BLOCK_SIZE, avgRow * BLOCK_SIZE);
  addToHistory(formula, name);
}

function updateFlashAnimation(now) {
  if (!state.isFlashing) return;

  const elapsed = now - state.flashStartTime;
  if (elapsed > 600) {
    clearMatchedCells();
    state.isFlashing = false;
    state.flashingCells = [];
    applyGravity();

    const newMatches = findAnyMatch();
    if (newMatches) {
      startFlashAnimation(newMatches);
    } else {
      spawnBlock();
    }
  }
}

function clearMatchedCells() {
  const points = state.flashingCells.length * 10;
  state.score += points;
  state.fallInterval = Math.max(
    FALL_INTERVAL_MIN,
    FALL_INTERVAL_INITIAL - state.score * SPEED_INCREASE_PER_SCORE
  );
  updateScoreDisplay();

  for (const cell of state.flashingCells) {
    state.grid[cell.row][cell.col] = null;
  }
}

function applyGravity() {
  for (let col = 0; col < COLS; col++) {
    let writeRow = ROWS - 1;
    for (let row = ROWS - 1; row >= 0; row--) {
      if (state.grid[row][col] !== null) {
        if (row !== writeRow) {
          state.grid[writeRow][col] = state.grid[row][col];
          state.grid[row][col] = null;
        }
        writeRow--;
      }
    }
  }
}

function findAnyMatch() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (state.grid[r][c] === null) continue;
      const component = getConnectedComponent(r, c);
      if (component.length >= 2) {
        const match = findZeroSumSubset(component);
        if (match) return match;
      }
    }
  }
  return null;
}

// ============================================================
// FORMULA POPUP
// ============================================================
function showFormulaPopup(formula, name, x, y) {
  const popup = document.getElementById('formula-popup');
  const el = document.createElement('div');
  el.className = 'formula-text';
  el.textContent = formula + ' — ' + name;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  popup.appendChild(el);

  setTimeout(() => {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 1500);
}

function addToHistory(formula, name) {
  state.compoundHistory.unshift({ formula, name });
  if (state.compoundHistory.length > 5) {
    state.compoundHistory.pop();
  }
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  for (const entry of state.compoundHistory) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="hist-formula">' + entry.formula + '</span>'
      + '<span class="hist-name">' + entry.name + '</span>';
    list.appendChild(li);
  }
}

// ============================================================
// RENDERING
// ============================================================
function render(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawSettledBlocks(now);
  drawCurrentBlock();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(30, 60, 100, 0.3)';
  ctx.lineWidth = 0.5;

  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
}

function drawSettledBlocks(now) {
  const flashSet = new Set();
  if (state.isFlashing) {
    for (const cell of state.flashingCells) {
      flashSet.add(cell.row * COLS + cell.col);
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (state.grid[r][c] === null) continue;

      const isFlashing = flashSet.has(r * COLS + c);
      let alpha = 1;

      if (isFlashing) {
        const elapsed = now - state.flashStartTime;
        alpha = Math.abs(Math.sin(elapsed / 80 * Math.PI));
      }

      drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, state.grid[r][c], alpha);
    }
  }
}

function drawCurrentBlock() {
  if (!state.currentBlock) return;
  const block = state.currentBlock;
  drawBlock(
    ctx,
    block.col * BLOCK_SIZE,
    block.row * BLOCK_SIZE,
    BLOCK_SIZE,
    block.ionIndex,
    1
  );

  // Draw ghost
  let ghostRow = block.row;
  while (ghostRow + 1 < ROWS && state.grid[ghostRow + 1][block.col] === null) {
    ghostRow++;
  }
  if (ghostRow !== block.row) {
    drawBlock(
      ctx,
      block.col * BLOCK_SIZE,
      ghostRow * BLOCK_SIZE,
      BLOCK_SIZE,
      block.ionIndex,
      0.2
    );
  }
}

function drawBlock(context, x, y, size, ionIndex, alpha) {
  const ion = IONS[ionIndex];
  const padding = 2;

  context.save();
  context.globalAlpha = alpha;

  // Block body
  const grad = context.createLinearGradient(x, y, x, y + size);
  grad.addColorStop(0, ion.color);
  grad.addColorStop(1, ion.colorDark);
  context.fillStyle = grad;

  context.beginPath();
  roundRect(context, x + padding, y + padding, size - padding * 2, size - padding * 2, 6);
  context.fill();

  // Border glow
  context.strokeStyle = ion.color;
  context.lineWidth = 1.5;
  context.beginPath();
  roundRect(context, x + padding, y + padding, size - padding * 2, size - padding * 2, 6);
  context.stroke();

  // Ion text
  context.fillStyle = '#ffffff';
  context.font = 'bold 16px Courier New';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(ion.display, x + size / 2, y + size / 2);

  context.restore();
}

function roundRect(context, x, y, w, h, r) {
  context.moveTo(x + r, y);
  context.lineTo(x + w - r, y);
  context.quadraticCurveTo(x + w, y, x + w, y + r);
  context.lineTo(x + w, y + h - r);
  context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  context.lineTo(x + r, y + h);
  context.quadraticCurveTo(x, y + h, x, y + h - r);
  context.lineTo(x, y + r);
  context.quadraticCurveTo(x, y, x + r, y);
  context.closePath();
}

function renderNextPreview() {
  previewCtx.clearRect(0, 0, 40, 40);
  drawBlock(previewCtx, 0, 0, 40, state.nextIonIndex, 1);
}

function updateScoreDisplay() {
  document.getElementById('score-display').textContent = 'SCORE: ' + state.score;
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(now) {
  requestAnimationFrame(gameLoop);

  if (state.gameOver) {
    render(now);
    return;
  }

  updateFlashAnimation(now);

  if (!state.isFlashing && state.currentBlock) {
    if (now - state.lastFallTime >= state.fallInterval) {
      state.lastFallTime = now;
      if (!canFall(state.currentBlock)) {
        landBlock();
      } else {
        state.currentBlock.row++;
      }
    }
  }

  render(now);
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInput('left');
});
document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInput('right');
});
document.getElementById('btn-cycle').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInput('cycle');
});
document.getElementById('btn-drop').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInput('drop');
});
document.getElementById('restart-btn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  resetGame();
});

// Keyboard support
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft':
    case 'a':
      handleInput('left');
      break;
    case 'ArrowRight':
    case 'd':
      handleInput('right');
      break;
    case 'ArrowUp':
    case 'w':
      handleInput('cycle');
      break;
    case 'ArrowDown':
    case 's':
      handleInput('drop');
      break;
  }
});

// ============================================================
// START
// ============================================================
resetGame();
requestAnimationFrame(gameLoop);
</script>
